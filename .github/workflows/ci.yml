# Copyright 2025, 2026 Query Farm LLC - https://query.farm
#
# CI for @query-farm/vgi.
#
# Two jobs:
#   unit        — pure TypeScript: build + `bun test` (arrow-js and flechette)
#                 + Arrow facade parity.
#                 No DuckDB / vgi extension needed. Fast, always runs.
#   integration — the C++ sqllogictest suite from the Query-farm/vgi repo, run
#                 against the bun example workers through ci/run-integration.sh
#                 — the same harness vgi-go and vgi-python use. See ci/README.md.
#
# ── Why the integration job no longer calls `make test-http` ─────────────────
# It used to, with LOCAL_EXTENSION_REPO pointed at the community repo *globally*.
# `vgi` is not autoloadable so it installed fine from there; `httpfs` IS
# autoloadable, so DuckDB's CheckRequire took the autoinstall branch and issued
# `INSTALL httpfs FROM '<community repo>'`, which 404s. A failed `require` is a
# silent SKIP_TEST, and vgi/scripts/run_tests.py has no skipped category at all
# (`passes = [r for r in results if r["exit"] == 0]`, and DuckDB exits 0 on a
# skip). Result: 261 of 286 test cases skipped while this job reported
# "passed: 280" in 84 seconds. ci/run-integration.sh scopes the community repo
# to `vgi` alone, takes every other extension FROM core, and — the part that
# makes it stay fixed — counts skips, names them, fails on any skip that is not
# in its expected-skip allowlist, and enforces a floor on executed test cases.
#
# Excluded tests are NOT listed here: ci/run-integration.sh owns that list, with
# the reason for each, so the exclusions live next to the harness that applies
# them instead of being split across a Makefile and a workflow env var.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # Test sources and statically linked binaries come from this exact native commit.
  # Both refs are vgi's protocol-3.4 branch (3.4.0, upload URLs v2,
  # external_storage/upload_integrity). The 3.4 extension is published; these
  # may move to the merged commit.
  VGI_REF: e99683f2af215c5a166697945e796c91d0cc66fe
  VGI_VENDOR_REF: e99683f2af215c5a166697945e796c91d0cc66fe
  VGI_NATIVE_RUNNER_BRANCH: protocol-3.4

jobs:
  unit:
    name: Unit (bun test on both backends + build + parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (types + bundles)
        run: bun run build

      - name: Unit tests
        run: bun test

      # The same suite on the flechette backend (what workerd resolves). The
      # in-process HTTP tests drive vgi-rpc's own client, so this needs a
      # vgi-rpc whose stream client writes through the facade.
      - name: Unit tests (flechette)
        run: bun --conditions=flechette test

      - name: Arrow facade parity (arrow-js + flechette)
        run: make test-facade-parity

      # Packs the tarball and type-checks a consumer project against it with
      # strict flags (noUncheckedIndexedAccess, exactOptionalPropertyTypes).
      # Fails if any shipped .d.ts drags SDK source into the consumer program.
      - name: Consumer type-check (packed tarball, strict flags)
        run: scripts/check-consumer-types.sh

      # Orchard hosted mode must not depend on Bun: run the built worker-cf
      # bundle's Pass gate under plain Node (the unit suite covers the contract
      # on Bun, both backends).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Orchard hosted mode on Node
        run: node scripts/hosted-node-smoke.mjs

  hosted-protocols:
    # vgi-rpc's hosted-protocols group (MULTI_PROTOCOL_HOSTING.md §7) against
    # the example fixture worker: the worker lists vgi.v3 then
    # conformance.Secondary.v1 on stdio, AF_UNIX and HTTP, the secondary passes
    # the shared error-model groups, and over HTTP vgi_rpc.Identity.v2 passes
    # the identity fixture groups. The reference is unpinned main, by design: a
    # reference change that breaks this SDK should turn it red the day it lands.
    name: Hosted protocols (stdio, unix, http + identity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout vgi-typescript
        uses: actions/checkout@v4

      - name: Check out vgi-rpc-python (the conformance suite)
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-python
          path: .vgi-rpc-python

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the reference
        run: pip install "./.vgi-rpc-python[http,conformance]" pytest pytest-timeout

      - name: Hosted-protocols group
        run: ci/run-hosted-protocols.sh

  orchard-hosted:
    # vgi's SDK-neutral Orchard hosted-mode harness (test/hosted, the definition
    # of done for VGI_ORCHARD_HOSTED=1) against examples/orchard-hosted-worker.ts,
    # on both Arrow backends.
    name: "Orchard hosted mode (${{ matrix.backend }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: arrowjs
            conditions: ""
          - backend: flechette
            conditions: flechette
    steps:
      - name: Checkout vgi-typescript
        uses: actions/checkout@v4

      - name: Checkout Query-farm/vgi (supplies test/hosted)
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          path: .vgi
          # vgi's protocol-3.4 branch (the 3.4 extension is published).
          ref: fce57984a7e8ea35f9dcd4a034b5ed37c85ca5c5
          sparse-checkout: test/hosted

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Hosted-mode conformance
        env:
          VGI_SRC: ${{ github.workspace }}/.vgi
          VGI_BUN_CONDITIONS: ${{ matrix.conditions }}
        run: ci/run-orchard-hosted-conformance.sh

  integration:
    # Lanes run independently (fail-fast: false) so a regression in one is never
    # masked by another. The plain subprocess transport is deliberately absent:
    # it pays a bun cold start per test and thrashes CI's 2-core runners.
    name: "Integration (${{ matrix.lane }} — ${{ matrix.backend }}${{ matrix.checksum && format(' — checksum {0}', matrix.checksum) || '' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole suite over the stateless HTTP transport, per Arrow backend.
          - { lane: http, backend: arrow-js, conditions: '' }
          # VGI_BUN_CONDITIONS=flechette selects the flechette backend while
          # keeping @query-farm/vgi-rpc in Node mode (the broad `worker`
          # condition also flips vgi-rpc to its browser build and drops
          # tcpConnect, breaking the Node HTTP worker).
          - { lane: http, backend: flechette, conditions: flechette }
          # The AF_UNIX launcher transport (the repo's default `make test`). One
          # warm bun worker serves the whole run, so it is the *fastest* lane,
          # and it covers what http structurally cannot: the launcher-only tests
          # and the four subprocess-pool-semantics files.
          - { lane: launch, backend: arrow-js, conditions: '' }
          # RPC 0.29.2 adapts incoming IPC to the selected Arrow backend.
          - { lane: launch, backend: flechette, conditions: flechette }
          # The http lane with everything externalized through a fake blob
          # vendor (results over 4 KiB are pointers, requests over 32 KiB go
          # up through vendor upload URLs, storage values over 4 KiB live in
          # the vendor), plus test/sql/external_storage. Pinned to the vgi
          # commit that defines that contract (VGI_VENDOR_REF).
          - { lane: vendor, backend: arrow-js, conditions: '' }
          - { lane: vendor, backend: flechette, conditions: flechette }
          # The same lane and test files, unchanged, with the worker on direct
          # S3 storage (VGI_STORAGE_BACKEND=s3) against RustFS (the pinned
          # image vgi-rpc-java's storage-integration job uses), and once with
          # VGI_STORAGE_S3_CHECKSUM=none (no upload grants).
          - { lane: s3, backend: arrow-js, conditions: '', checksum: '' }
          - { lane: s3, backend: arrow-js, conditions: '', checksum: none }
    steps:
      - name: Checkout vgi-typescript
        uses: actions/checkout@v4

      - name: Checkout Query-farm/vgi (supplies test/sql/integration)
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          path: vgi-upstream
          ref: ${{ (matrix.lane == 'vendor' || matrix.lane == 's3') && env.VGI_VENDOR_REF || env.VGI_REF }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The vendor lane's fake blob vendor runs with uvx from a pinned
      # vgi-rpc-python commit (vgi test/start_fake_blob_vendor.sh).
      - name: Set up uv (vendor lane)
        if: matrix.lane == 'vendor'
        uses: astral-sh/setup-uv@v10.3.3

      - name: Start RustFS (s3 lane)
        if: matrix.lane == 's3'
        env:
          AWS_ACCESS_KEY_ID: vgi-lane-access
          AWS_SECRET_ACCESS_KEY: vgi-lane-secret-key
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=vgi-lane-access -e RUSTFS_SECRET_KEY=vgi-lane-secret-key \
            -e RUSTFS_CONSOLE_ENABLE=false -e RUSTFS_OBS_LOGGER_LEVEL=error \
            ghcr.io/rustfs/rustfs@sha256:29c02251c085cb04edce556304a9ec0f8fba0c40300266cf4f3d953783fe2450
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1 && break; sleep 1; done
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket vgi-lane

      - name: Download native runner matching the test suite
        run: |
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py" \
            --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          GH_TOKEN: ${{ github.token }}

      - name: Integration suite (${{ matrix.lane }} / ${{ matrix.backend }})
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          TRANSPORT: ${{ matrix.lane }}
          VGI_BUN_CONDITIONS: ${{ matrix.conditions }}
          VGI_S3_LANE_ENDPOINT: http://127.0.0.1:9000
          VGI_S3_LANE_BUCKET: vgi-lane
          VGI_S3_LANE_ACCESS_KEY_ID: vgi-lane-access
          VGI_S3_LANE_SECRET_ACCESS_KEY: vgi-lane-secret-key
          VGI_S3_LANE_CHECKSUM: ${{ matrix.checksum }}
